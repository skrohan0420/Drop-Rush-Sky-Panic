<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>Drop Rush: Sky Panic</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        margin: 0;
        overflow: hidden;
        background: #05070d !important;
      }

      /* Fixed inset fills the WebView reliably; padding on #app can desync Phaser parent bounds vs canvas. */
      #app {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070d !important;
      }

      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app,
      canvas {
        touch-action: none;
        -ms-touch-action: none;
      }

      canvas {
        display: block;
        background: #05070d;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
